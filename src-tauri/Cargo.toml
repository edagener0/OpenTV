[package]
name = "opentv"
version = "1.0.0"
description = "OpenTV desktop and mobile client"
authors = ["OpenTV contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "opentv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "~2.8", features = ["cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
