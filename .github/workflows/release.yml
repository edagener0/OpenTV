name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the GitHub release as a draft
        type: boolean
        default: true
      publish-docker:
        description: Publish the Docker image to GHCR
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || 'false' }}

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            target: ''
            args: ''
          - name: Windows
            platform: windows-latest
            target: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend and Tauri CLI dependencies
        run: npm ci --workspace @opentv/web --include-workspace-root

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: OpenTV v__VERSION__
          releaseBody: Desktop, Android and Docker builds of OpenTV v__VERSION__.
          releaseDraft: ${{ env.RELEASE_DRAFT }}
          prerelease: false
          args: ${{ matrix.args }}

  android:
    name: Android
    needs: desktop
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend and Tauri CLI dependencies
        run: npm ci --workspace @opentv/web --include-workspace-root

      - name: Generate Android project
        run: |
          npx tauri android init --ci
          npx tauri icon assets/icon.svg

      - name: Build APK and AAB
        run: npx tauri android build --apk --aab

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SIGN_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGN_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. Signing with an ephemeral key; updates will require reinstalling."
            password="$(openssl rand -hex 16)"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -alias opentv \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$password" -keypass "$password" \
              -dname "CN=OpenTV, O=OpenTV, C=US"
            echo "::add-mask::$password"
            echo "SIGN_PASSWORD=$password" >> "$GITHUB_ENV"
            echo "SIGN_ALIAS=opentv" >> "$GITHUB_ENV"
          fi

      - name: Sign artifacts
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tools="${ANDROID_HOME}/build-tools/34.0.0"
          outputs="src-tauri/gen/android/app/build/outputs"
          mkdir -p dist-android
          apk="$(find "$outputs/apk" -name '*-release-unsigned.apk' | head -n 1)"
          "$tools/zipalign" -p -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$SIGN_ALIAS" \
            --ks-pass env:SIGN_PASSWORD --key-pass env:SIGN_PASSWORD \
            --out "dist-android/OpenTV_${version}_android.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "dist-android/OpenTV_${version}_android.apk"
          aab="$(find "$outputs/bundle" -name '*-release.aab' | head -n 1)"
          cp "$aab" "dist-android/OpenTV_${version}_android.aab"
          jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass:env SIGN_PASSWORD \
            -keypass:env SIGN_PASSWORD "dist-android/OpenTV_${version}_android.aab" "$SIGN_ALIAS"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: opentv-android
          path: dist-android/*
          if-no-files-found: error

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${APP_VERSION}" dist-android/* --clobber

  docker:
    name: Docker image
    if: github.event_name == 'push' || inputs.publish-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
